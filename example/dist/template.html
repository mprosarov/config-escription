<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Тема оформления: URL-параметр ?theme=<имя> (сохраняется в localStorage)
      // или ранее сохранённое значение localStorage['ui-theme'].
      // Применяется до загрузки CSS, чтобы избежать мигания светлой темы.
      (function () {
        var params = new URLSearchParams(window.location.search);
        var theme = params.get("theme") || localStorage.getItem("ui-theme");
        if (theme) {
          document.documentElement.setAttribute("data-theme", theme);
          localStorage.setItem("ui-theme", theme);
        }
      })();
    </script>
    <link rel="stylesheet" href="css/app.css" />
    <title>Отчет</title>
  </head>
  <body></body>
</html>

<script src="js/vendors.js"></script>
<script src="js/app.js"></script>
<script>
  // Тут какой-то запрос кофигурации с сервера
  // Например: let config = await fetch("/config");
  function initPage(params) {
    let configName = getUrlParamByName("config") || "index";
    PageBuilder.loadPageConfig(configName);
  }
  function getUrlParamByName(name, url = window.location.search) {
    let searchParams = new URLSearchParams(url);
    let urlConfigName = searchParams.get("config");
    if (urlConfigName === null) return null;
    return urlConfigName === undefined ? "" : urlConfigName;
  }
  initPage();
</script>
