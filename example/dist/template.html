<script>

// Тут какой-то запрос кофигурации с сервера
// Например: let config = await fetch("/config");
let configName = getUrlParamByName('config') || 'index';
PageBuilder.loadPageConfig(configName);
function getUrlParamByName(name, url = window.location.search) {
  let searchParams = new URLSearchParams(url);
  let urlConfigName = searchParams.get("config");
  if(urlConfigName === null) return null;
  return urlConfigName === undefined ? '' : urlConfigName;  
}
</script>
