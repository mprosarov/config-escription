name: Telegram + LLM review

on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Get commit diff and message
        run: |
          git log -1 --format=%B > /tmp/msg.txt
          git show --no-color --format="" HEAD -- . ':(exclude)package-lock.json' > /tmp/diff.txt || true
          head -c 20000 /tmp/diff.txt > /tmp/diff_trim.txt

      - name: Ask LLM (Alibaba Cloud)
        if: ${{ vars.LLM_REVIEW_ENABLED != 'false' }}
        env:
          ALIYUN_API_KEY: ${{ secrets.ALIYUN_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL || 'qwen3.8-max' }}
          LLM_API_URL: ${{ vars.LLM_API_URL || 'https://token-plan.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1/chat/completions' }}
        run: |
          jq -n \
            --arg model "$LLM_MODEL" \
            --rawfile msg /tmp/msg.txt \
            --rawfile diff /tmp/diff_trim.txt \
            '{
              model: $model,
              temperature: 0.2,
              messages: [
                {role: "system", content: "Ты — строгий, но справедливый ревьюер кода. Отвечай на русском, кратко, без воды."},
                {role: "user", content: ("Проанализируй коммит.\n\nСообщение коммита:\n" + $msg + "\n\nDiff:\n" + $diff + "\n\nВерни СТРОГО в формате:\n\nПересказ: <1-3 предложения о сути изменений>\n\nОценка: <одно из: Обратить внимание | Приемлемо | Косметика>\n\nПочему: <1-2 предложения обоснования>\n\nПравила оценки: Обратить внимание — баги, уязвимости, критичные ошибки, ломающие изменения. Приемлемо — рабочий код с мелкими замечаниями. Косметика — стиль, форматирование, опечатки, без влияния на логику.")}
              ]
            }' > /tmp/payload.json

          curl -sS --max-time 120 "$LLM_API_URL" \
            -H "Authorization: Bearer $ALIYUN_API_KEY" \
            -H "Content-Type: application/json" \
            -d @/tmp/payload.json > /tmp/llm.json || true

          jq -r '.choices[0].message.content // empty' /tmp/llm.json > /tmp/review.txt 2>/dev/null || true
          if [ ! -s /tmp/review.txt ]; then
            echo "LLM не вернул ответ" > /tmp/review.txt
            echo "LLM response (first 500 bytes):" >&2
            head -c 500 /tmp/llm.json >&2 || true
          fi

      - name: LLM review disabled
        if: ${{ vars.LLM_REVIEW_ENABLED == 'false' }}
        run: echo "Авто-ревью коммита отключено" > /tmp/review.txt

      - name: Send to Telegram
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.actor }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          {
            printf '🤖 Быстрое ревью коммита в %s\nОт: %s\nВетка: %s\nСообщение: %s\nURL: https://github.com/%s/commit/%s\n\n🤖 ' \
              "$REPO" "$ACTOR" "$BRANCH" "$(head -n1 /tmp/msg.txt)" "$REPO" "$SHA"
            cat /tmp/review.txt
          } | head -c 3800 | iconv -c -f UTF-8 -t UTF-8 > /tmp/tg.txt

          curl -sS --fail-with-body -X POST \
            "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT}" \
            --data-urlencode text@/tmp/tg.txt
